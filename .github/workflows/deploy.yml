name: deploy

# Etapa 1: valida Terraform y comprueba que el rol OIDC se puede asumir.
# Los jobs plan / apply / deploy-k8s / smoke-test se añadirán después.
on:
  push:
    branches: [main]

permissions:
  id-token: write   # necesario para pedir el token OIDC a GitHub
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "^1.10.0"

      - name: terraform fmt
        run: terraform fmt -check -recursive
        working-directory: terraform

      - name: terraform init (sin backend)
        run: terraform init -backend=false -input=false
        working-directory: terraform

      - name: terraform validate
        run: terraform validate
        working-directory: terraform

  # Prueba 1: sub esperado = repo:WlisonG/sentinel-split:ref:refs/heads/main
  oidc-check:
    runs-on: ubuntu-24.04
    steps:
      - name: Mostrar claims del token OIDC (diagnóstico)
        run: |
          TOKEN=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r .value)
          echo "::add-mask::$TOKEN"
          P=$(echo "$TOKEN" | cut -d. -f2 | tr '_-' '/+')
          while [ $(( ${#P} % 4 )) -ne 0 ]; do P="${P}="; done
          echo "$P" | base64 -d | jq '{iss, sub, aud, repository, repository_owner, ref, environment}'

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Quién soy
        run: aws sts get-caller-identity

  # Prueba 2: sub esperado = repo:WlisonG/sentinel-split:environment:production
  oidc-check-production:
    runs-on: ubuntu-24.04
    environment: production
    steps:
      - name: Mostrar claims del token OIDC (diagnóstico)
        run: |
          TOKEN=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r .value)
          echo "::add-mask::$TOKEN"
          P=$(echo "$TOKEN" | cut -d. -f2 | tr '_-' '/+')
          while [ $(( ${#P} % 4 )) -ne 0 ]; do P="${P}="; done
          echo "$P" | base64 -d | jq '{iss, sub, aud, repository, repository_owner, ref, environment}'

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Quién soy
        run: aws sts get-caller-identity